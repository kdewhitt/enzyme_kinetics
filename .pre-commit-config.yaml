repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.8
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [ python, pyi, jupyter, pyproject ]
        args: [ --fix ] # Auto-fix issues where possible
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi, jupyter ]