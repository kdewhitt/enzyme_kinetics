[project]
name = "enzyme-kinetics"
version = "0.1.3"
description = "Compute Michaelis-Menten enzyme kinetics."
readme = "README.md"
requires-python = ">=3.14"

authors = [
    { name = "Kristofer R Gonzalez-DeWhitt", email = "k.gonzalez.dewhitt@gmail.com" },
]

keywords = [
    "enzyme-kinetics",
    "michaelis-menten",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.4",
    "tyro>=1.0.13",
]

[project.scripts]
analyze = "enzyme_kinetics.main:main"
calibrate = "enzyme_kinetics.calibrate:main"

[project.urls]
Homepage = "https://github.com/kdewhitt/enzyme_kinetics"
Repository = "https://github.com/kdewhitt/enzyme_kinetics"
# Issues = "https://github.com/kdewhitt/enzyme_kinetics/issues"


# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"


# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------

[tool.uv]
link-mode = "copy"


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 99
extend-exclude = [
    "build",
    "dist",
    "legacy",
]

[tool.ruff.lint]
extend-select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "COM", # flake8-commas
    "D", # pydocstyle
    "E", # pycodestyle errors
    "EM", # flake8-errmsg
    "F", # Pyflakes
    "FA", # flake8-future-annotations
    "FURB", # refurb
    "SIM", # flake8-simplify
    # "TCH", # type-checking imports
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]

ignore = [
    "COM812",
    "COM819",
    "D203",
    "D206",
    "D213",
    "D300",
    "DTZ005",
    "E111",
    "E114",
    "E117",
    "EM101",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false  # allow trailing commas


# ---------------------------------------------------------------------------
# Development dependencies
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
    { include-group = "debug" },
]

lint = [
    "pylint>=4.0.5",
    "ruff>=0.15.14",
]

test = [
    "pytest>=9.0.3",
]

typing = [
    "pandas-stubs>=3.0.3.260530",
    "scipy-stubs>=1.17.1.4",
    "ty>=0.0.39",
]

debug = [
    "icecream>=2.2.0",
]
