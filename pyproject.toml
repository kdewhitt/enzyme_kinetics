[project]
name = "enzyme-kinetics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kristofer Gonzalez-DeWhitt", email = "k.gonzalez.dewhitt@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pylint>=4.0.5",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.4",
]

[project.scripts]
enzyme-kinetics = "enzyme_kinetics:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
